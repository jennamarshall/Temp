[project]
name = "spotify-mcp"
version = "0.1.0"
description = "MCP server for Spotify: read playlists, add to existing playlists, and evaluate songs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "httpx2>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
spotify-mcp = "spotify_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
